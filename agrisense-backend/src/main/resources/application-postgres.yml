spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agrisense}
    username: ${DATABASE_USER:agrisense}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

